name: Deploy to GAS and GCF

on:
  push:
    branches:
      - main

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0
      - name: Authenticate clasp
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
      - name: Set script ID from secret
        run: |
          cd gas
          sed -i "s/YOUR_SCRIPT_ID_HERE/${{ secrets.GAS_SCRIPT_ID }}/" .clasp.json
      - name: Deploy to GAS
        run: |
          cd gas
          clasp push -f

  deploy-gcf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: '${{ vars.WIF_PROVIDER }}'
          service_account: '${{ vars.SA_EMAIL }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
      - name: Deploy Cloud Function
        run: |
          cd functions
          # 認証必須（非公開）でデプロイする。
          # --allow-unauthenticated は付けない（allUsers への setIamPolicy が走り、
          # デプロイ用 SA に run.services.setIamPolicy が無いとデプロイが失敗するため）。
          # 呼び出し許可（roles/run.invoker）はワークスペースのドメイン/グループへ
          # 別途 IAM で付与する。
          gcloud functions deploy generate_excel \
            --gen2 \
            --runtime python310 \
            --trigger-http \
            --entry-point generate_excel \
            --region asia-northeast1 \
            --project '${{ vars.PROJECT_ID }}'
