name: Deploy to GAS and GCF

on:
  push:
    branches:
      - main

jobs:
  deploy-gas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Authenticate clasp
        run: |
          echo '${{ secrets.CLASP_CREDENTIALS }}' > ~/.clasprc.json
      - name: Set script ID from secret
        run: |
          cd gas
          sed -i "s/YOUR_SCRIPT_ID_HERE/${{ secrets.GAS_SCRIPT_ID }}/" .clasp.json
      - name: Deploy to GAS
        run: |
          cd gas
          clasp push -f

  deploy-gcf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      - name: Deploy Cloud Function
        run: |
          cd functions
          gcloud functions deploy generate_excel \
            --runtime python310 \
            --trigger-http \
            --allow-unauthenticated \
            --entry-point generate_excel \
            --region asia-northeast1
